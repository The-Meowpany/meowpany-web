name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      # --force only skips npm's platform check for the WebAssembly compiler package (see ci.yml).
      - run: npm ci --force
      - run: npm test
      - run: npm run build
        env:
          # The custom domain serves the site at its root. Set the SITE_URL repository variable if the
          # public address changes; never derive the base path from the repository name, because that
          # produces /meowpany-web/ URLs that do not exist on the custom domain.
          SITE_URL: ${{ vars.SITE_URL || 'https://meowpany.us.ci' }}
          BASE_PATH: "/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
