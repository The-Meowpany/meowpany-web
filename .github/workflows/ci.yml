name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      # --force only skips npm's platform check for the WebAssembly compiler package (declared cpu
      # wasm32), which this repository needs on CPUs without AVX2. A plain `npm ci` refuses it on x64.
      - run: npm ci --force
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=moderate
